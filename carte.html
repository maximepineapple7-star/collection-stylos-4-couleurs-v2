<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection stylos Bic 4 Couleurs - Carte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header>
 <h1>Collection stylos Bic 4 Couleurs</h1>
 <nav class="nav-pages">
 <a href="accueil.html">Accueil</a>
 <a href="index.html">Stylos</a>
 <a href="categorie.html">Catégories</a>
 <a href="carte.html" class="active">Carte</a>
 <a href="collection.html">Ma collection</a>
 </nav>
</header>
<main>
 <div class="filtre-bar">
 <input type="text" id="recherche-ville" placeholder="Rechercher une ville (ex: Bordeaux)">
 <button type="button" id="btn-recherche-ville" class="btn-export">Rechercher</button>
 <div>
 <label for="filtre-carte-type">Type :</label>
 <select id="filtre-carte-type">
 <option value="">Tous les types</option>
 <option value="publicitaire">Stylos publicitaires</option>
 <option value="touristique">Stylos touristiques</option>
 <option value="édition limitée">Édition limitée</option>
 <option value="sport">Sport</option>
 <option value="voiture">Voiture</option>
 <option value="armée">Armée</option>
 </select>
 </div>
 </div>

 <div id="carte" class="carte-container"></div>
</main>

<div id="modal-voir-detail" class="modal-overlay" style="display:none;">
 <div class="modal-content">
 <button id="fermer-modal-detail-vue" class="fermer-modal">&times;</button>
 <div id="detail-vue-contenu"></div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="carte.js"></script>
</body>
</html>
