<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection stylos Bic 4 Couleurs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
 <h1>Collection stylos Bic 4 Couleurs</h1>
<nav class="nav-pages">
 <a href="accueil.html">Accueil</a>
 <a href="index.html" class="active">Stylos</a>
 <a href="categorie.html">Catégories</a>
 <a href="carte.html">Carte</a>
 </nav>
</header>
<main>
 <section id="formulaire-ajout">
 <h2>Ajouter un stylo</h2>
 <form id="form-stylo">
 <input type="text" id="nom" placeholder="Nom du stylo" required>
 <div class="tag-picker" id="categorie-picker">
 <div class="tags-selectionnees" id="categorie-tags"></div>
 <input type="text" id="categorie-input" placeholder="Ajouter une catégorie...">
 <div class="tag-suggestions" id="categorie-suggestions"></div>
 </div>
 <div class="rarete-field">
 <select id="rarete_circulation">
 <option value="">Rareté de circulation</option>
 <option value="Commun">Commun</option>
 <option value="Peu commun">Peu commun</option>
 <option value="Rare">Rare</option>
 <option value="Très rare">Très rare</option>
 <option value="Exceptionnel">Exceptionnel</option>
 </select>
 <button type="button" class="btn-astero" data-type="circulation">?</button>
 </div>
 <div class="rarete-field">
 <select id="rarete_acquisition">
 <option value="">Rareté d'acquisition</option>
 <option value="Commun">Commun</option>
 <option value="Peu commun">Peu commun</option>
 <option value="Rare">Rare</option>
 <option value="Très rare">Très rare</option>
 <option value="Exceptionnel">Exceptionnel</option>
 </select>
 <button type="button" class="btn-astero" data-type="acquisition">?</button>
 </div>
 <select id="source">
 <option value="">Choisir une source</option>
 <option value="Site internet (boutique)">Site internet (boutique)</option>
 <option value="Site internet (revente)">Site internet (revente)</option>
 <option value="Boutique physique">Boutique physique</option>
 <option value="Évènement">Évènement</option>
 <option value="Don">Don</option>
 <option value="__nouveau__">+ Ajouter une nouvelle source</option>
 </select>
 <input type="text" id="source-nouveau" placeholder="Nom de la nouvelle source" style="display:none;">
 <input type="date" id="date_acquisition">
 <select id="statut">
 <option value="possédé">Possédé</option>
 <option value="en négociation">En négociation</option>
 <option value="recherché">Recherché</option>
 </select>
 <input type="text" id="lieu_ville" placeholder="Ville">
 <input type="text" id="lieu_nom" placeholder="Nom du lieu (monument, boutique...)">
 <input type="number" step="any" id="lieu_lat" placeholder="Latitude GPS">
 <input type="number" step="any" id="lieu_lng" placeholder="Longitude GPS">
 <input type="file" id="photo" accept="image/*">
 <textarea id="notes" placeholder="Notes"></textarea>
 <button type="submit">Ajouter le stylo</button>
 </form>
 <p id="message-form"></p>
 </section>

 <div class="tri-bar">
 <label for="tri-select">Trier par :</label>
 <select id="tri-select">
 <option value="alphabetique">Ordre alphabétique</option>
 <option value="acquisition">Rareté d'acquisition</option>
 <option value="circulation">Rareté de circulation</option>
 <option value="moyenne">Rareté moyenne</option>
 </select>
 </div>

 <div id="collection">
 <p>Chargement de la collection...</p>
 </div>
</main>

<div id="modal-detail" class="modal-overlay" style="display:none;">
 <div class="modal-content">
 <button id="fermer-modal" class="fermer-modal">&times;</button>
 <h2>Modifier le stylo</h2>
 <form id="form-modif-stylo">
 <input type="hidden" id="modif-id">
 <input type="hidden" id="modif-photo-actuelle">
 <label>Nom
 <input type="text" id="modif-nom" required>
 </label>
 <label>Catégorie
 <div class="tag-picker" id="modif-categorie-picker">
 <div class="tags-selectionnees" id="modif-categorie-tags"></div>
 <input type="text" id="modif-categorie-input" placeholder="Ajouter une catégorie...">
 <div class="tag-suggestions" id="modif-categorie-suggestions"></div>
 </div>
 </label>
 <label>Rareté de circulation
 <div class="rarete-field">
 <select id="modif-rarete_circulation">
 <option value="">Choisir</option>
 <option value="Commun">Commun</option>
 <option value="Peu commun">Peu commun</option>
 <option value="Rare">Rare</option>
 <option value="Très rare">Très rare</option>
 <option value="Exceptionnel">Exceptionnel</option>
 </select>
 <button type="button" class="btn-astero" data-type="circulation">?</button>
 </div>
 </label>
 <label>Rareté d'acquisition
 <div class="rarete-field">
 <select id="modif-rarete_acquisition">
 <option value="">Choisir</option>
 <option value="Commun">Commun</option>
 <option value="Peu commun">Peu commun</option>
 <option value="Rare">Rare</option>
 <option value="Très rare">Très rare</option>
 <option value="Exceptionnel">Exceptionnel</option>
 </select>
 <button type="button" class="btn-astero" data-type="acquisition">?</button>
 </div>
 </label>
 <label>Source
 <select id="modif-source">
 <option value="">Choisir une source</option>
 <option value="Site internet (boutique)">Site internet (boutique)</option>
 <option value="Site internet (revente)">Site internet (revente)</option>
 <option value="Boutique physique">Boutique physique</option>
 <option value="Évènement">Évènement</option>
 <option value="Don">Don</option>
 <option value="__nouveau__">+ Ajouter une nouvelle source</option>
 </select>
 <input type="text" id="modif-source-nouveau" placeholder="Nom de la nouvelle source" style="display:none; margin-top: 6px;">
 </label>
  <label>Année d'acquisition
 <input type="number" id="modif-date_acquisition" min="1950" max="2100">
 </label>
 <label>Statut
 <select id="modif-statut">
 <option value="possédé">Possédé</option>
 <option value="en négociation">En négociation</option>
 <option value="recherché">Recherché</option>
 </select>
 </label>
 <label>Ville
 <input type="text" id="modif-lieu_ville">
 </label>
 <label>Nom du lieu (monument, boutique...)
 <input type="text" id="modif-lieu_nom">
 </label>
 <label>Latitude GPS
 <input type="number" step="any" id="modif-lieu_lat">
 </label>
 <label>Longitude GPS
 <input type="number" step="any" id="modif-lieu_lng">
 </label>
 <label>Photo (laisser vide pour garder la photo actuelle)
 <input type="file" id="modif-photo" accept="image/*">
 </label>
 <label>Notes
 <textarea id="modif-notes"></textarea>
 </label>
 <button type="submit">Enregistrer les modifications</button>
 <button type="button" id="btn-supprimer-stylo" class="btn-supprimer">Supprimer le stylo</button>
 </form>
 <p id="message-modif"></p>
 </div>
</div>

<div id="modal-rarete-info" class="modal-overlay" style="display:none;">
 <div class="modal-content">
 <button id="fermer-modal-rarete" class="fermer-modal">&times;</button>
 <h2 id="rarete-info-titre">Échelle de rareté</h2>
 <div id="rarete-info-contenu"></div>
 </div>
</div>

<div id="modal-voir-detail" class="modal-overlay" style="display:none;">
 <div class="modal-content">
 <button id="fermer-modal-detail-vue" class="fermer-modal">&times;</button>
 <div id="detail-vue-contenu"></div>
 </div>
</div>

<script src="script.js"></script>
</body>
</html>
